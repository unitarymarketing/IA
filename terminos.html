<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="facebook-domain-verification" content="opv1aibg45szrv1w1djkxyiw6q69sm" />
    <title>Términos de Servicio - Unitary Marketing IA</title>

    <!-- SEO & Social Media Info -->
    <link rel="icon" type="image/png" href="Diseño 2/Logo Unitary.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>

    <!-- Babel for browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- COMPONENTS ---

        const CookieBanner = () => {
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const consent = localStorage.getItem('unitary_cookie_consent');
                if (!consent) {
                    setIsVisible(true);
                }
            }, []);

            const handleAccept = () => {
                localStorage.setItem('unitary_cookie_consent', 'true');
                setIsVisible(false);
            };

            return (
                <AnimatePresence>
                    {isVisible && (
                        <motion.div
                            initial={{ y: 100, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            exit={{ y: 100, opacity: 0 }}
                            transition={{ type: "spring", stiffness: 300, damping: 30 }}
                            style={{
                                position: 'fixed',
                                bottom: '20px',
                                left: '20px',
                                right: '20px',
                                zIndex: 9999,
                                display: 'flex',
                                justifyContent: 'center'
                            }}
                        >
                            <div style={{
                                background: 'rgba(10, 10, 15, 0.95)',
                                backdropFilter: 'blur(10px)',
                                border: '1px solid rgba(0, 209, 255, 0.3)',
                                borderRadius: '16px',
                                padding: '1.5rem',
                                maxWidth: '800px',
                                width: '100%',
                                display: 'flex',
                                flexDirection: window.innerWidth < 768 ? 'column' : 'row',
                                alignItems: 'center',
                                gap: '1.5rem',
                                boxShadow: '0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0, 209, 255, 0.1)'
                            }}>
                                <p style={{
                                    fontFamily: "'Roboto', sans-serif",
                                    color: '#e2e8f0',
                                    fontSize: '0.95rem',
                                    lineHeight: 1.5,
                                    margin: 0,
                                    flex: 1
                                }}>
                                    Utilizamos cookies para optimizar tu experiencia y analizar el tráfico del sitio. Al continuar navegando, aceptas nuestra <a href="cookies.html" style={{ color: '#00FFFF', textDecoration: 'underline' }}>Política de Cookies</a>.
                                </p>
                                <button onClick={handleAccept} className="btn btn-primary" style={{
                                    whiteSpace: 'nowrap',
                                    padding: '0.6rem 1.5rem',
                                    fontSize: '0.9rem',
                                    width: window.innerWidth < 768 ? '100%' : 'auto'
                                }}>
                                    Aceptar
                                </button>
                            </div>
                        </motion.div>
                    )}
                </AnimatePresence>
            );
        };

        const Navbar = () => {
            const [scrolled, setScrolled] = useState(false);
            const [menuOpen, setMenuOpen] = useState(false);
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [menuOpen, isMobile]);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <motion.nav
                    initial={{ opacity: 0, y: -20 }}
                    animate={{ opacity: 1, y: 0 }}
                    transition={{ duration: 0.8, ease: "easeOut" }}
                    className={`navbar`}
                    style={{
                        background: scrolled ? 'rgba(5, 5, 10, 0.95)' : 'rgba(5, 5, 10, 0)',
                        borderBottom: scrolled ? '1px solid rgba(0, 209, 255, 0.2)' : '1px solid transparent',
                        padding: isMobile ? '0.75rem 1.25rem' : '1rem 3rem',
                        position: 'fixed',
                        top: 0,
                        left: 0,
                        right: 0,
                        zIndex: 1000,
                        backdropFilter: 'blur(10px)',
                        WebkitBackdropFilter: 'blur(10px)'
                    }}
                >
                    <div style={{ display: 'flex', alignItems: 'center', width: isMobile ? '100%' : 'auto', justifyContent: isMobile ? 'space-between' : 'flex-start' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                            {isMobile && (
                                <button onClick={() => setMenuOpen(!menuOpen)} style={{ background: 'transparent', border: 'none', color: '#00FFFF', cursor: 'pointer', padding: '0', display: 'flex', alignItems: 'center', justifyContent: 'center', marginRight: '4px' }}>
                                    <i data-lucide={menuOpen ? "x" : "menu"} style={{ width: '28px', height: '28px' }}></i>
                                </button>
                            )}
                            <div style={{ fontSize: isMobile ? '1.1rem' : '1.8rem', fontWeight: 900, display: 'flex', alignItems: 'center', zIndex: 110 }} className="text-cyan navbar-logo">
                                <span className="navbar-logo-full">UNITARY</span>
                            </div>
                        </div>
                        {isMobile && (
                            <a href="index.html#cotizador" className="btn btn-primary navbar-cta" style={{ padding: '0.4rem 0.8rem', fontSize: '0.75rem', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box' }}>
                                VOLVER AL INICIO
                            </a>
                        )}
                    </div>

                    {!isMobile && (
                        <>
                            <div className="nav-links">
                                <a href="index.html#inicio" className="nav-link">Inicio</a>
                                <a href="index.html#servicios" className="nav-link">Servicios</a>
                                <a href="index.html#luan" className="nav-link">Luan</a>
                                <a href="index.html#portfolio" className="nav-link">Portfolio</a>
                                <a href="index.html#contacto" className="nav-link">Contacto</a>
                            </div>

                            <a href="index.html" className="btn btn-primary" style={{ textDecoration: 'none', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box' }}>
                                Volver al Inicio
                            </a>
                        </>
                    )}

                    {/* Mobile Dropdown Menu */}
                    <AnimatePresence>
                        {isMobile && menuOpen && (
                            <motion.div
                                initial={{ opacity: 0, height: 0 }}
                                animate={{ opacity: 1, height: 'auto' }}
                                exit={{ opacity: 0, height: 0 }}
                                style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: 'rgba(5, 5, 10, 0.98)', borderBottom: '1px solid rgba(0, 209, 255, 0.2)', padding: '1.5rem', display: 'flex', flexDirection: 'column', gap: '1rem', zIndex: 100, overflow: 'hidden' }}
                            >
                                <a href="index.html#inicio" onClick={() => setMenuOpen(false)} style={{ color: '#A1A1AA', textDecoration: 'none', fontSize: '1rem', fontWeight: 600 }}>Inicio</a>
                                <a href="index.html#servicios" onClick={() => setMenuOpen(false)} style={{ color: '#A1A1AA', textDecoration: 'none', fontSize: '1rem', fontWeight: 600 }}>Servicios</a>
                                <a href="index.html#contacto" onClick={() => setMenuOpen(false)} style={{ color: '#A1A1AA', textDecoration: 'none', fontSize: '1rem', fontWeight: 600 }}>Contacto</a>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </motion.nav>
            );
        };

        const Footer = () => {
            return (
                <footer style={{
                    position: 'relative',
                    zIndex: 50,
                    borderTop: '1px solid rgba(255,255,255,0.1)',
                    background: 'rgba(0,0,0,0.6)',
                    backdropFilter: 'blur(12px)',
                    paddingTop: '3rem',
                    paddingBottom: '2rem',
                    marginTop: 'auto'
                }}>
                    <div className="container" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center' }}>
                        <motion.div
                            initial={{ opacity: 0 }}
                            whileInView={{ opacity: 1 }}
                            viewport={{ once: true }}
                            style={{
                                fontSize: '1.5rem',
                                fontWeight: 900,
                                letterSpacing: '0.2em',
                                color: 'rgba(255,255,255,0.9)',
                                marginBottom: '1.5rem',
                                filter: 'drop-shadow(0 0 8px rgba(255,255,255,0.5))',
                            }}
                        >
                            UNITARY MARKETING AI
                        </motion.div>

                        <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '2rem', marginBottom: '2rem', fontSize: '0.9rem', fontWeight: 600, position: 'relative', zIndex: 60 }}>
                            <a href="/terminos.html" style={{ color: '#00FFFF', textDecoration: 'underline', textUnderlineOffset: '4px', transition: 'all 0.3s ease', cursor: 'pointer', filter: 'drop-shadow(0 0 10px #00FFFF)' }}>Términos de Servicio</a>
                            <a href="/privacidad.html" style={{ color: '#fff', textDecoration: 'underline', textUnderlineOffset: '4px', transition: 'all 0.3s ease', cursor: 'pointer' }} onMouseEnter={e => { e.target.style.color = '#00FFFF'; e.target.style.filter = 'drop-shadow(0 0 10px #00FFFF)'; }} onMouseLeave={e => { e.target.style.color = '#fff'; e.target.style.filter = 'none'; }}>Política de Privacidad</a>
                        </div>

                        <p style={{ color: '#A1A1AA', fontSize: '0.75rem', opacity: 0.6 }}>
                            &copy; {new Date().getFullYear()} Unitary Marketing IA. El futuro es ahora.
                        </p>
                    </div>
                </footer>
            );
        };

        const Terminos = () => {
            return (
                <section className="section container" style={{ paddingTop: '10rem', paddingBottom: '6rem', minHeight: '80vh', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                    <div className="glow-blob glow-cyan" style={{ top: '10%', right: '10%', width: '400px', height: '400px', opacity: 0.25 }}></div>
                    <div className="glow-blob glow-purple" style={{ bottom: '10%', left: '10%', width: '400px', height: '400px', opacity: 0.15 }}></div>
                    
                    <motion.div 
                        initial={{ opacity: 0, y: 30 }}
                        animate={{ opacity: 1, y: 0 }}
                        transition={{ duration: 0.8 }}
                        className="glass-card magic-glass" 
                        style={{ padding: '3.5rem', borderRadius: '24px', maxWidth: '800px', width: '100%', background: 'rgba(10, 10, 15, 0.7)', border: '1px solid rgba(0, 209, 255, 0.2)', position: 'relative', zIndex: 10, boxShadow: '0 0 50px rgba(0, 209, 255, 0.05)' }}
                    >
                        <h1 style={{ fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 900, color: '#fff', marginBottom: '2rem', fontFamily: "'Inter', sans-serif", letterSpacing: '-0.02em', lineHeight: 1.2 }}>
                            Términos de Servicio de <span className="text-cyan">Unitary Marketing AI</span>
                        </h1>
                        <p style={{ color: '#A1A1AA', fontSize: '1.15rem', lineHeight: 1.8, marginBottom: '2rem', fontFamily: "'Roboto', sans-serif" }}>
                            Al acceder y utilizar los servicios de automatización de nuestra aplicación "Unitary AI Bot", de propiedad de Unitary Marketing AI, aceptas cumplir con los siguientes términos y condiciones.
                        </p>

                        <h2 style={{ fontSize: '1.8rem', fontWeight: 800, color: '#00FFFF', marginBottom: '1.5rem', fontFamily: "'Inter', sans-serif", marginTop: '3.5rem', letterSpacing: '-0.01em' }}>
                            Uso del servicio y responsabilidades
                        </h2>
                        <p style={{ color: '#A1A1AA', fontSize: '1.15rem', lineHeight: 1.8, marginBottom: '2rem', fontFamily: "'Roboto', sans-serif" }}>
                            El cliente es el único responsable de garantizar que el uso de las automatizaciones de IA cumpla con las Políticas de Comercio y Mensajería de Meta vigentes. Unitary Marketing AI provee la infraestructura técnica, pero no se responsabiliza por el bloqueo o suspensión de cuentas de Instagram, WhatsApp o Facebook debido al mal uso de la plataforma por parte del usuario final (ej. envío de spam o contenido prohibido).
                        </p>
                    </motion.div>
                </section>
            );
        };

        const App = () => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            return (
                <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh', background: '#05050A' }}>
                    <Navbar />
                    <Terminos />
                    <Footer />
                    <CookieBanner />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
